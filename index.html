<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TELLUS - Localizador de Instalações</title>
    <style>
        :root {
            --brand-blue: #0056b3;
            --brand-light-blue: #e6f0fa;
            --white: #ffffff;
            --text-color: #333;
        }

        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--brand-light-blue);
            color: var(--text-color);
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        header {
            background-color: var(--brand-blue);
            width: 100%;
            padding: 1.5rem 0;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            text-align: center;
        }

        h1 {
            color: var(--white);
            margin: 0;
            font-size: 2.2rem;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .subtitle {
            color: rgba(255, 255, 255, 0.9);
            font-size: 0.9rem;
            margin-top: 5px;
        }

        .main-container {
            background-color: var(--white);
            width: 90%;
            max-width: 600px;
            margin-top: -30px;
            padding: 2rem;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.15);
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }

        .file-upload-section {
            border: 2px dashed var(--brand-blue);
            padding: 15px;
            border-radius: 8px;
            text-align: center;
            background-color: #fcfcfc;
        }

        .file-upload-label {
            display: block;
            margin-bottom: 10px;
            color: var(--brand-blue);
            font-weight: bold;
            font-size: 0.9rem;
        }

        .search-box {
            position: relative;
        }

        .search-label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #555;
        }

        input[type="text"] {
            width: 100%;
            padding: 14px 15px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 1.1rem;
            box-sizing: border-box;
            transition: border-color 0.3s;
        }

        input[type="text"]:focus {
            border-color: var(--brand-blue);
            outline: none;
        }

        .result-card {
            background-color: var(--white);
            border-left: 6px solid var(--brand-blue);
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
            display: none;
            animation: fadeIn 0.4s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .result-row {
            margin-bottom: 10px;
            font-size: 1.05rem;
        }

        .result-label {
            font-weight: bold;
            color: #555;
            display: inline-block;
            width: 110px;
        }

        .btn-maps {
            display: block;
            width: 100%;
            text-align: center;
            background-color: var(--brand-blue);
            color: white;
            text-decoration: none;
            padding: 15px 0;
            border-radius: 8px;
            font-weight: bold;
            font-size: 1.1rem;
            margin-top: 15px;
            transition: background-color 0.3s, transform 0.2s;
        }

        .btn-maps:hover {
            background-color: #003d80;
            transform: translateY(-2px);
        }

        .status-msg {
            text-align: center;
            font-size: 0.9rem;
            margin-top: 10px;
            color: #666;
            word-break: break-all;
        }
        
        .status-success { color: green; }
        .status-error { color: red; }
    </style>
</head>
<body>

<header>
    <h1>TELLUS</h1>
    <div class="subtitle">Sistema de Localização Geográfica</div>
</header>

<div class="main-container">
    
    <div class="file-upload-section">
        <label class="file-upload-label" for="txtFile">
            📂 Carregar arquivo (.txt)
        </label>
        <input type="file" id="txtFile" accept=".txt, .csv, .json">
        <div id="fileStatus" class="status-msg">Aguardando arquivo...</div>
    </div>

    <div class="search-box">
        <label class="search-label" for="searchInput">Pesquisar Instalação ou Série:</label>
        <input type="text" id="searchInput" placeholder="Digite o número..." onkeyup="buscarInstalacao()">
    </div>

    <div id="resultArea" class="result-card">
        <div class="result-row">
            <span class="result-label">Instalação:</span>
            <span id="resInstal"></span>
        </div>
        <div class="result-row">
            <span class="result-label">Nº Série:</span>
            <span id="resSerie"></span>
        </div>
        <div class="result-row">
            <span class="result-label">Latitude:</span>
            <span id="resLat"></span>
        </div>
        <div class="result-row">
            <span class="result-label">Longitude:</span>
            <span id="resLon"></span>
        </div>

        <a id="linkMaps" href="#" target="_blank" class="btn-maps">
            📍 Abrir no Google Maps
        </a>
    </div>

    <div id="notFound" class="status-msg status-error" style="display:none;">
        Instalação não encontrada.
    </div>
</div>

<script>
    let instalacoes = [];

    // Função para carregar o arquivo TXT
    document.getElementById('txtFile').addEventListener('change', function(event) {
        const file = event.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        const statusDiv = document.getElementById('fileStatus');
        
        statusDiv.innerText = "Lendo arquivo...";
        
        reader.onload = function(e) {
            const conteudo = e.target.result;

            try {
                // TENTATIVA 1: Tentar ler como JSON direto (caso o txt contenha JSON)
                const json = JSON.parse(conteudo);
                if (Array.isArray(json)) {
                    instalacoes = json;
                    finalizarCarregamento(statusDiv, json.length);
                    return;
                }
            } catch (err) {
                // Se falhar, não é JSON. Vamos para a Tentativa 2.
                console.log("Não é JSON válido, tentando CSV...");
            }

            try {
                // TENTATIVA 2: Ler como CSV/Texto Tabulado
                // Assume que a primeira linha é o cabeçalho
                const dadosConvertidos = parseCSV(conteudo);
                if (dadosConvertidos && dadosConvertidos.length > 0) {
                    instalacoes = dadosConvertidos;
                    finalizarCarregamento(statusDiv, dadosConvertidos.length);
                } else {
                    throw new Error("Formato não reconhecido");
                }
            } catch (error) {
                statusDiv.innerText = "Erro: O arquivo TXT não está em um formato reconhecido (JSON ou CSV).";
                statusDiv.className = "status-msg status-error";
            }
        };
        reader.readAsText(file);
    });

    function finalizarCarregamento(element, qtd) {
        element.innerText = `Sucesso! ${qtd} instalações carregadas do TXT.`;
        element.className = "status-msg status-success";
        buscarInstalacao(); 
    }

    // Função auxiliar para converter CSV/Texto em Objetos
    function parseCSV(text) {
        // Divide por linhas
        const linhas = text.trim().split(/\r?\n/);
        if (linhas.length < 2) return null;

        // Pega cabeçalhos da primeira linha (sep. por virgula, ponto-virgula ou tab)
        // Remove aspas se houver
        const headers = linhas[0].split(/[;,	]/).map(h => h.replace(/['"]+/g, '').trim());
        
        const resultado = [];

        for (let i = 1; i < linhas.length; i++) {
            const linhaAtual = linhas[i];
            if (!linhaAtual.trim()) continue; // Pula linhas vazias

            // Tenta separar igual ao cabeçalho
            // Nota: Isso é um parser simples, pode falhar se houver virgulas DENTRO dos valores
            const valores = linhaAtual.split(/[;,	]/).map(v => v.replace(/['"]+/g, '').trim());
            
            if (valores.length === headers.length) {
                let obj = {};
                headers.forEach((header, index) => {
                    obj[header] = valores[index];
                });
                resultado.push(obj);
            }
        }
        return resultado;
    }

    function buscarInstalacao() {
        const input = document.getElementById('searchInput').value.trim().toLowerCase();
        const resultArea = document.getElementById('resultArea');
        const notFound = document.getElementById('notFound');

        if (input.length === 0) {
            resultArea.style.display = 'none';
            notFound.style.display = 'none';
            return;
        }

        // Busca Inteligente: Instalação ou Série
        const resultado = instalacoes.find(item => {
            // Adaptação para chaves que podem variar no TXT
            // Tenta pegar "Instal" ou "Instalação" ou a primeira coluna
            const instalVal = String(item["Instal"] || item["Instalação"] || Object.values(item)[0] || "").toLowerCase();
            const serieVal = String(item["Nº Serie"] || item["Serie"] || "").toLowerCase();
            
            return instalVal.startsWith(input) || serieVal.startsWith(input);
        });

        if (resultado) {
            resultArea.style.display = 'block';
            notFound.style.display = 'none';
            
            // Tenta encontrar as chaves corretas dinamicamente
            const valInstal = resultado["Instal"] || resultado["Instalação"] || Object.values(resultado)[0];
            const valSerie = resultado["Nº Serie"] || resultado["Serie"] || "-";
            const valLat = resultado["Latitude localiz.geográfica"] || resultado["Latitude"] || resultado["Lat"];
            const valLon = resultado["Longitude localiz.geográfica"] || resultado["Longitude"] || resultado["Lon"];

            document.getElementById('resInstal').innerText = valInstal;
            document.getElementById('resSerie').innerText = valSerie;
            document.getElementById('resLat').innerText = valLat;
            document.getElementById('resLon').innerText = valLon;
            
            const mapLink = `https://www.google.com/maps/search/?api=1&query=${valLat},${valLon}`;
            document.getElementById('linkMaps').href = mapLink;

        } else {
            resultArea.style.display = 'none';
            notFound.style.display = 'block';
        }
    }
</script>

</body>
</html>
