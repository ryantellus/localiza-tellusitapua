<!DOCTYPE html>
<html lang="pt-br">
<head>
    <img src="TELLUSCAPA.jpg" width="1200">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TELLUS - Localizador de Instalações</title>
    <style>
        :root {
            --brand-blue: #0056b3;
            --brand-light-blue: #e6f0fa;
            --white: #ffffff;
            --text-color: #333;
        }

        body {
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--brand-light-blue);
            color: var(--text-color);
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        header {
            background-color: var(--brand-blue);
            width: 100%;
            padding: 1.5rem 0;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            text-align: center;
        }

        h1 {
            color: var(--white);
            margin: 0;
            font-size: 2.2rem;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .subtitle {
            color: rgba(255, 255, 255, 0.9);
            font-size: 0.9rem;
            margin-top: 5px;
        }

        .main-container {
            background-color: var(--white);
            width: 90%;
            max-width: 600px;
            margin-top: -30px;
            padding: 2rem;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.15);
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }

        .file-upload-section {
            border: 2px dashed var(--brand-blue);
            padding: 15px;
            border-radius: 8px;
            text-align: center;
            background-color: #fcfcfc;
        }

        .file-upload-label {
            display: block;
            margin-bottom: 10px;
            color: var(--brand-blue);
            font-weight: bold;
            font-size: 0.9rem;
        }

        .example-text {
            font-size: 0.75rem;
            color: #777;
            margin-top: 5px;
            font-style: italic;
        }

        .search-box {
            position: relative;
        }

        .search-label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #555;
        }

        input[type="text"] {
            width: 100%;
            padding: 14px 15px;
            border: 2px solid #ddd;
            border-radius: 8px;
            font-size: 1.1rem;
            box-sizing: border-box;
            transition: border-color 0.3s;
        }

        input[type="text"]:focus {
            border-color: var(--brand-blue);
            outline: none;
        }

        .result-card {
            background-color: var(--white);
            border-left: 6px solid var(--brand-blue);
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.05);
            display: none;
            animation: fadeIn 0.4s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .result-row {
            margin-bottom: 10px;
            font-size: 1.05rem;
        }

        .result-label {
            font-weight: bold;
            color: #555;
            display: inline-block;
            width: 110px;
        }

        .btn-maps {
            display: block;
            width: 100%;
            text-align: center;
            background-color: var(--brand-blue);
            color: white;
            text-decoration: none;
            padding: 15px 0;
            border-radius: 8px;
            font-weight: bold;
            font-size: 1.1rem;
            margin-top: 15px;
            transition: background-color 0.3s, transform 0.2s;
        }

        .btn-maps:hover {
            background-color: #003d80;
            transform: translateY(-2px);
        }

        .status-msg {
            text-align: center;
            font-size: 0.9rem;
            margin-top: 10px;
            color: #666;
            word-break: break-all;
        }
        
        .status-success { color: green; }
        .status-error { color: red; }
    </style>
</head>
<body>

<header>
    <h1>TELLUS</h1>
    <div class="subtitle">Sistema de Localização Geográfica</div>
</header>

<div class="main-container">
    
    <div class="file-upload-section">
        <label class="file-upload-label" for="txtFile">
            📂 Carregar Base de Dados (.txt ou .json)
        </label>
        <input type="file" id="txtFile" accept=".txt, .csv, .json">
        <div class="example-text">O arquivo .txt deve ter cabeçalho na 1ª linha (ex: Instal;Latitude;Longitude)</div>
        <div id="fileStatus" class="status-msg">Aguardando arquivo...</div>
    </div>

    <div class="search-box">
        <label class="search-label" for="searchInput">Pesquisar:</label>
        <input type="text" id="searchInput" placeholder="Digite Nº Instalação ou Série..." onkeyup="buscarInstalacao()">
    </div>

    <div id="resultArea" class="result-card">
        <div class="result-row">
            <span class="result-label">Instalação:</span>
            <span id="resInstal"></span>
        </div>
        <div class="result-row">
            <span class="result-label">Nº Série:</span>
            <span id="resSerie"></span>
        </div>
        <div class="result-row">
            <span class="result-label">Latitude:</span>
            <span id="resLat"></span>
        </div>
        <div class="result-row">
            <span class="result-label">Longitude:</span>
            <span id="resLon"></span>
        </div>

        <a id="linkMaps" href="#" target="_blank" class="btn-maps">
            📍 Abrir no Google Maps
        </a>
    </div>

    <div id="notFound" class="status-msg status-error" style="display:none;">
        Instalação não encontrada.
    </div>
</div>

<script>
    let instalacoes = [];

    // Função principal de leitura do arquivo
    document.getElementById('txtFile').addEventListener('change', function(event) {
        const file = event.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        const statusDiv = document.getElementById('fileStatus');
        
        statusDiv.innerText = "Processando arquivo...";
        statusDiv.className = "status-msg";
        
        reader.onload = function(e) {
            const conteudo = e.target.result;

            try {
                // 1. Tenta ler como JSON
                const json = JSON.parse(conteudo);
                if (Array.isArray(json)) {
                    instalacoes = json;
                    finalizarCarregamento(statusDiv, json.length);
                    return;
                }
            } catch (err) {
                // Ignora erro de JSON e segue para TXT
            }

            try {
                // 2. Tenta ler como TXT / CSV
                const dadosConvertidos = parseTXT(conteudo);
                if (dadosConvertidos && dadosConvertidos.length > 0) {
                    instalacoes = dadosConvertidos;
                    finalizarCarregamento(statusDiv, dadosConvertidos.length);
                } else {
                    throw new Error("Formato inválido ou vazio");
                }
            } catch (error) {
                statusDiv.innerText = "Erro: Não foi possível ler os dados. Verifique se o TXT tem cabeçalho.";
                statusDiv.className = "status-msg status-error";
                console.error(error);
            }
        };
        reader.readAsText(file);
    });

    function finalizarCarregamento(element, qtd) {
        element.innerText = `Sucesso! ${qtd} instalações carregadas.`;
        element.className = "status-msg status-success";
        // Se o usuário já tinha digitado algo, refaz a busca com os novos dados
        buscarInstalacao(); 
    }

    // Função inteligente para ler TXT (CSV, Tabulado ou Ponto e Vírgula)
    function parseTXT(text) {
        const linhas = text.trim().split(/\r?\n/);
        if (linhas.length < 2) return null;

        // Detecta o separador usando a primeira linha (cabeçalho)
        const primeiraLinha = linhas[0];
        let separador = ',';
        if (primeiraLinha.includes(';')) separador = ';';
        else if (primeiraLinha.includes('\t')) separador = '\t';

        // Limpa aspas do cabeçalho
        const headers = primeiraLinha.split(separador).map(h => h.replace(/['"]+/g, '').trim());
        
        const resultado = [];

        for (let i = 1; i < linhas.length; i++) {
            const linhaAtual = linhas[i];
            if (!linhaAtual.trim()) continue;

            const valores = linhaAtual.split(separador).map(v => v.replace(/['"]+/g, '').trim());
            
            // Cria o objeto apenas se tiver o mesmo número de colunas (ou próximo)
            if (valores.length > 0) {
                let obj = {};
                headers.forEach((header, index) => {
                    // Proteção caso a linha tenha menos colunas que o cabeçalho
                    obj[header] = valores[index] || "";
                });
                resultado.push(obj);
            }
        }
        return resultado;
    }

    function buscarInstalacao() {
        const input = document.getElementById('searchInput').value.trim().toLowerCase();
        const resultArea = document.getElementById('resultArea');
        const notFound = document.getElementById('notFound');

        if (input.length === 0) {
            resultArea.style.display = 'none';
            notFound.style.display = 'none';
            return;
        }

        // Busca Flexível
        const resultado = instalacoes.find(item => {
            // Normaliza as chaves para minúsculo para encontrar "Instal" ou "instal" ou "Instalação"
            const keys = Object.keys(item);
            
            // Tenta achar o valor da instalação
            const keyInstal = keys.find(k => k.toLowerCase().includes("instal"));
            const valInstal = keyInstal ? String(item[keyInstal]) : "";

            // Tenta achar o número de série
            const keySerie = keys.find(k => k.toLowerCase().includes("serie") || k.toLowerCase().includes("série"));
            const valSerie = keySerie ? String(item[keySerie]) : "";
            
            return valInstal.toLowerCase().startsWith(input) || valSerie.toLowerCase().startsWith(input);
        });

        if (resultado) {
            resultArea.style.display = 'block';
            notFound.style.display = 'none';
            
            // Mapeamento dinâmico de colunas para exibição
            const keys = Object.keys(resultado);
            
            const keyInstal = keys.find(k => k.toLowerCase().includes("instal")) || keys[0];
            const keySerie = keys.find(k => k.toLowerCase().includes("serie") || k.toLowerCase().includes("série"));
            const keyLat = keys.find(k => k.toLowerCase().includes("latitud") || k.toLowerCase() === "lat");
            const keyLon = keys.find(k => k.toLowerCase().includes("longitud") || k.toLowerCase() === "lon" || k.toLowerCase() === "lng");

            const valLatRaw = keyLat ? resultado[keyLat] : "";
            const valLonRaw = keyLon ? resultado[keyLon] : "";

            // Formata coordenadas (Troca vírgula por ponto para o Google Maps funcionar)
            const valLat = valLatRaw.replace(',', '.');
            const valLon = valLonRaw.replace(',', '.');

            document.getElementById('resInstal').innerText = resultado[keyInstal] || "-";
            document.getElementById('resSerie').innerText = keySerie ? resultado[keySerie] : "-";
            document.getElementById('resLat').innerText = valLat;
            document.getElementById('resLon').innerText = valLon;
            
            // Gera o link do Google Maps
            if(valLat && valLon) {
                const mapLink = `https://www.google.com/maps?q=${valLat},${valLon}`;
                const btnMaps = document.getElementById('linkMaps');
                btnMaps.href = mapLink;
                btnMaps.style.display = 'block';
                btnMaps.innerText = "📍 Abrir no Google Maps";
            } else {
                document.getElementById('linkMaps').style.display = 'none';
            }

        } else {
            resultArea.style.display = 'none';
            notFound.style.display = 'block';
        }
    }
</script>

</body>
</html>
